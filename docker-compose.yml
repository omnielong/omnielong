version: '3.8'

services:
  # Frontend POS Application
  pos-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: omnielong-pos
    ports:
      - '8080:80'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pos-network

  # Development environment (optional)
  pos-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: omnielong-pos-dev
    ports:
      - '5173:5173'
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    profiles:
      - dev
    networks:
      - pos-network

